services:
  redis:
    command: redis-server --bind 127.0.0.1 --port "$PORT" --save '' --appendonly no
    port: 6379
  web:
    command: >-
      php artisan config:clear &&
      APP_URL="$PUBLIC_URL" ASSET_URL="$PUBLIC_URL"
      php artisan serve --host=0.0.0.0 --port="$PORT"
    env:
      TRUSTED_PROXIES: "127.0.0.1,::1"
    health: /up
    portal:
      title: Freyr
      description: Follow the setup wizard to create a local development account. Uses built assets; run pnpm build after frontend changes.
