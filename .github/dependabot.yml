version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 5
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: "composer"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 5
    # Minor and patch updates arrive as one weekly PR; each major update
    # gets its own PR, since those usually need code changes.
    groups:
      composer:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 5
    # Minor and patch updates arrive as one weekly PR; each major update
    # gets its own PR, since those usually need code changes.
    groups:
      npm:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
