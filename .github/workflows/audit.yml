name: audit

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  # Advisories are published without a commit here, so also check weekly.
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.5'
          tools: composer:v2
          coverage: none

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 10.34.7

      - name: Composer audit
        run: composer audit --locked

      # Moderate and low findings are mostly in build tooling; Dependabot
      # picks those up without failing every pull request.
      - name: pnpm audit
        run: pnpm audit --audit-level high
